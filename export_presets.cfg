[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
export_filter="all_resources"
include_filter="LICENSE,*.txt,assets/*.txt"
exclude_filter="tests/*,tools/*,docs/*,build/*,app-store/*,.github/*,.ios-local/*,assets/neon_drift_icon_source.png"
export_path="docs/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"description\" content=\"NEON DRIFT 크라운 캠페인: 세 구역, 세 함선, 무기 진화와 영구 성장. 무료 브라우저 게임 (한국어/English).\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

progressive_web_app/ensure_cross_origin_isolation_headers=false

[preset.1]
name="iOS"
platform="iOS"
runnable=true
advanced_options=true
export_filter="all_resources"
include_filter="LICENSE,*.txt,assets/*.txt"
exclude_filter="tests/*,tools/*,docs/*,build/*,app-store/*,.github/*,.ios-local/*,assets/neon_drift_icon_source.png"
export_path="build/ios/neondrift.ipa"
script_export_mode=2

[preset.1.options]
architectures/arm64=true
application/app_store_team_id="58D934A2CR"
application/bundle_identifier="com.jkchat.neondrift"
application/short_version="1.0.0"
application/version="1"
application/export_project_only=true
application/export_method_debug=1
application/export_method_release=0
application/targeted_device_family=2
application/min_ios_version="15.0"
application/additional_plist_content="<key>CFBundleLocalizations</key><array><string>ko</string><string>en</string></array>"
icons/icon_1024x1024="res://assets/neon_drift_icon.png"
icons/app_store_1024x1024="res://assets/neon_drift_icon.png"
storyboard/image_scale_mode=1
storyboard/custom_image@2x="res://assets/neon_drift_splash.png"
storyboard/custom_image@3x="res://assets/neon_drift_splash.png"
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0.027451, 0.062745, 0.12549, 1)
privacy/tracking_enabled=false
privacy/tracking_domains=PackedStringArray()
privacy/file_timestamp_access_reasons=2
privacy/system_boot_time_access_reasons=1
privacy/disk_space_access_reasons=1
privacy/user_defaults_access_reasons=0
entitlements/game_center=false
entitlements/push_notifications="Disabled"
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false
